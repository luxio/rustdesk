# Eigener macOS-Client für rd.lux.io.
#
# Abgeleitet aus dem Upstream-Job `build-for-macOS` in flutter-build.yml (Tag 1.4.9),
# ergänzt um einen Schritt, der Serveradresse und Public Key fest in den Client backt.
# Damit entfällt beim Kunden das Entsperren der Netzwerkeinstellungen und der Import
# des Konfigstrings — die beiden TCC-Freigaben bleiben natürlich.
#
# Benötigte Repository-Secrets (Settings -> Secrets and variables -> Actions):
#   MACOS_P12_BASE64        Developer-ID-Zertifikat samt privatem Schlüssel als .p12, base64
#   MACOS_P12_PASSWORD      Passwort dieses .p12
#   MACOS_CODESIGN_IDENTITY z.B. "Developer ID Application: Stephane Lux (24B9N35YSF)"
# Für die Notarisierung zusätzlich:
#   MACOS_NOTARY_APPLE_ID   Apple-ID (E-Mail)
#   MACOS_NOTARY_TEAM_ID    Team-ID, z.B. 24B9N35YSF
#   MACOS_NOTARY_PASSWORD   app-spezifisches Passwort von appleid.apple.com
#
# Fehlt MACOS_P12_BASE64, läuft der Build durch und liefert ein unsigniertes DMG —
# brauchbar zum Testen, aber Gatekeeper blockt es beim Kunden. Fehlt nur
# MACOS_NOTARY_PASSWORD, wird signiert aber nicht notarisiert; Gatekeeper zeigt
# dann beim ersten Start eine Warnung, die der Kunde wegklicken müsste.
#
# Siehe .github/lux/README.md für die Einrichtung der Secrets.

name: lux macOS-Client

on:
  workflow_dispatch:

env:
  MAC_RUST_VERSION: "1.81" # 1.81 nötig für macOS, siehe yury/cidre
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VERSION: "1.4.9"
  UPLOAD_ARTIFACT: "true"

  # Eigener Server. Beide Werte sind öffentlich — sie stehen so auch auf
  # support.lux.io — deshalb hier im Klartext statt als Secret.
  LUX_RENDEZVOUS_SERVER: "rd.lux.io"
  LUX_RS_PUB_KEY: "IizurzL8I8eHrbgyIcEdyYvSvXwLwbsut4y9l12+sWQ="

  MACOS_P12_BASE64: "${{ secrets.MACOS_P12_BASE64 }}"
  # Auf Workflow-Ebene, weil `env:` eines Schritts im `if:` desselben Schritts
  # nicht sichtbar ist — die Bedingung wäre sonst immer falsch.
  MACOS_NOTARY_PASSWORD: "${{ secrets.MACOS_NOTARY_PASSWORD }}"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-for-macOS:
    name: ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    needs: [generate-bridge]
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: x86_64-apple-darwin,
              os: macos-15-intel,
              extra-build-args: "",
              arch: x86_64,
              vcpkg-triplet: x64-osx,
            }
          - {
              target: aarch64-apple-darwin,
              os: macos-14,
              extra-build-args: "--screencapturekit",
              arch: aarch64,
              vcpkg-triplet: arm64-osx,
            }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      # --- der einzige inhaltliche Unterschied zum Upstream-Build ---
      - name: Serverkonfiguration einbacken
        run: python3 .github/lux/patch-server-config.py

      - name: Import the codesign cert
        if: env.MACOS_P12_BASE64 != null
        uses: apple-actions/import-codesign-certs@253ddeeac23f2bdad1646faac5c8c2832e800071 # v1
        with:
          p12-file-base64: ${{ secrets.MACOS_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_P12_PASSWORD }}
          keychain: rustdesk

      - name: Signatur-Identität prüfen
        if: env.MACOS_P12_BASE64 != null
        run: |
          security default-keychain -s rustdesk.keychain
          security find-identity -v
          # Früh scheitern statt nach 25 Minuten Bauzeit. Der Schlüsselbund
          # enthält typischerweise mehrere Zertifikate; zum Verteilen taugt nur
          # "Developer ID Application". "Apple Development" ist zum Entwickeln
          # da, Gatekeeper akzeptiert es nicht und Apple notarisiert damit nicht.
          if ! security find-identity -v -p codesigning | grep -q "Developer ID Application"; then
            echo "::error::Im importierten .p12 steckt keine 'Developer ID Application'-Identität."
            echo "Gefunden wurde stattdessen:"
            security find-identity -v -p codesigning
            echo "Bitte in der Schlüsselbundverwaltung das richtige Zertifikat exportieren"
            echo "und MACOS_P12_BASE64 neu setzen."
            exit 1
          fi

      # Dasselbe für die Notarisierung: `notarytool history` meldet sich beim
      # Notardienst an und scheitert bei falschen Zugangsdaten mit 401 — nach
      # Sekunden, statt erst nach dem kompletten Build.
      - name: Notarisierungs-Zugang prüfen
        if: env.MACOS_P12_BASE64 != null && env.MACOS_NOTARY_PASSWORD != null
        run: |
          if ! xcrun notarytool history \
                 --apple-id "${{ secrets.MACOS_NOTARY_APPLE_ID }}" \
                 --team-id "${{ secrets.MACOS_NOTARY_TEAM_ID }}" \
                 --password "${{ secrets.MACOS_NOTARY_PASSWORD }}" \
                 --output-format json > /dev/null; then
            echo "::error::Apple lehnt die Notarisierungs-Zugangsdaten ab."
            echo "MACOS_NOTARY_APPLE_ID, MACOS_NOTARY_TEAM_ID und MACOS_NOTARY_PASSWORD prüfen."
            echo "Lokal testen: xcrun notarytool store-credentials lux-notary --apple-id <id> --team-id <team>"
            exit 1
          fi
          echo "Notarisierungs-Zugang ok"

      - name: Install build runtime
        run: |
          brew install llvm create-dmg
          if command -v pkg-config &>/dev/null; then
              echo "pkg-config is already installed"
          else
              brew install pkg-config
          fi

      - name: Install NASM
        run: |
          # NASM 2.16.x aus dem offiziellen Release. NICHT `brew install nasm` —
          # das liefert NASM 3.x, dessen CLI inkompatibel ist und an dem aom scheitert.
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          # https://github.com/flutter/flutter/issues/133533
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
          grep -n '_setFramesEnabledState(false);' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: ${{ matrix.job.os }}

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: Show version information (Rust, cargo, Clang)
        shell: bash
        run: |
          clang --version || true
          rustup -V
          rustup toolchain list
          rustup default
          cargo -V
          rustc -V

      - name: Build rustdesk
        run: |
          if [ "${{ matrix.job.target }}" = "aarch64-apple-darwin" ]; then
            MIN_MACOS_VERSION="12.3"
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
            sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
            sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          fi
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}

      # Ohne Zertifikat: unsigniertes DMG, nur zum Testen brauchbar.
      - name: DMG bauen (unsigniert)
        if: env.MACOS_P12_BASE64 == null
        run: |
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          create-dmg --icon "RustDesk.app" 200 190 --hide-extension "RustDesk.app" --window-size 800 400 --app-drop-link 600 185 rustdesk-lux-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg ./flutter/build/macos/Build/Products/Release/RustDesk.app

      # Die Secret-Werte werden wörtlich in dieses Skript eingesetzt — deshalb
      # überall in Anführungszeichen. Die Identität enthält Leerzeichen und
      # Klammern, unquoted ist das ein bash-Syntaxfehler. Upstream steht hier
      # ohne Quotes, weil dort der Hex-Fingerabdruck statt des Namens gesetzt wird.
      - name: Signieren und DMG bauen
        if: env.MACOS_P12_BASE64 != null
        run: |
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          security default-keychain -s rustdesk.keychain
          security unlock-keychain -p "${{ secrets.MACOS_P12_PASSWORD }}" rustdesk.keychain
          rm -rf *.dmg || true
          DMG="rustdesk-lux-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg"
          codesign --force --options runtime -s "${{ secrets.MACOS_CODESIGN_IDENTITY }}" --deep --strict ./flutter/build/macos/Build/Products/Release/RustDesk.app -vvv
          create-dmg --icon "RustDesk.app" 200 190 --hide-extension "RustDesk.app" --window-size 800 400 --app-drop-link 600 185 "$DMG" ./flutter/build/macos/Build/Products/Release/RustDesk.app
          codesign --force --options runtime -s "${{ secrets.MACOS_CODESIGN_IDENTITY }}" --deep --strict "$DMG" -vvv

      # notarytool statt rcodesign: liegt auf dem Runner ohnehin bei (Xcode CLT)
      # und kommt mit einem app-spezifischen Passwort aus, statt einen
      # App-Store-Connect-API-Key zu verlangen.
      - name: Notarisieren
        if: env.MACOS_P12_BASE64 != null && env.MACOS_NOTARY_PASSWORD != null
        run: |
          DMG="rustdesk-lux-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "${{ secrets.MACOS_NOTARY_APPLE_ID }}" \
            --team-id "${{ secrets.MACOS_NOTARY_TEAM_ID }}" \
            --password "${{ secrets.MACOS_NOTARY_PASSWORD }}" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Gegenprobe der Signatur
        if: env.MACOS_P12_BASE64 != null
        run: |
          DMG="rustdesk-lux-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg"
          spctl -a -t open --context context:primary-signature -v "$DMG" || true
          codesign -dv --verbose=4 ./flutter/build/macos/Build/Products/Release/RustDesk.app 2>&1 | head -20

      - name: DMG hochladen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-lux-macos-${{ matrix.job.arch }}
          path: rustdesk-lux-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg
